<text x="10.0" y="434.0" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="start" fill="#111">the band runs from 4 deg past the inward stop (15 deg) to 4 deg past the outward stop (27 deg). The groove (0 deg) continues back between two 10 x 5 mm basswood rails,</text>
