<text x="10.0" y="236.0" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="start" fill="#111">Open stop: M3 x 35 screw across the cheeks at s 6.2, h 8.1 mm from the roll pin</text>
<text x="10.0" y="264.0" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="start" fill="#111">(it meets the bar's top face at 100 deg). Arm: 128 mm offcut of the bar steel with printed 3 mm edge strips (25 wide). Loop: 70 x 100 mm teardrop, 12 mm shell.</text>
<text x="10.0" y="278.0" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="start" fill="#111">Mass 0.30 kg: arm 122 g, rod 63 g, printed parts about 47 g, slug (60 mm of bar offcut) 57 g, screws; weigh and add washers in the junction block to reach it.</text>
