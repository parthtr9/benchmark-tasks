<text x="10.0" y="532.0" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="start" fill="#111">Roller: printed 22 x 7 mm on an M8 bolt in the plunger's fork; spring in the tower's bore on an M8 adjusting screw.</text>
<text x="10.0" y="546.0" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="start" fill="#111">The trunnion (dark) turns on two 5 mm dowel pins in the yoke's cheeks; its lips run in the 4 mm gap between the bar and the T-rail (light blue).</text>
<text x="10.0" y="560.0" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="start" fill="#111">Spring: 2.13 N/mm, preloaded to 11.2 N with the bar level (M8 adjusting screw under it). Notch plate (pink) under the ceiling strip.</text>
